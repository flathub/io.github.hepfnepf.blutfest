app-id: io.github.hepfnepf.blutfest
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.godotengine.godot.BaseApp
# Godot version
base-version: '3.6-25.08'
command: godot-runner
finish-args:
  - --share=ipc
  - --socket=x11 # <-- Godot needs X11
  - --socket=pulseaudio
  - --device=dri
  - --device=all
modules:
  - name: Blutfest
    buildsystem: simple
    build-commands:
      # The game itself
      - install -D Blutfest.pck /app/bin/godot-runner.pck
      # Metadata and a .desktop file
      - install -D  ${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -D  ${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
      # Icons
      - install -D  ${FLATPAK_ID}.png -t /app/share/icons/hicolor/512x512/apps/
    sources:
      - type: file
        url: https://github.com/hepfnepf/Blutfest/releases/download/v0.4.3/Blutfest.pck
        sha256: f238a21134d56d21ebacaa1c93b86dd34e1c3aca28f06dff05134202e00ae60a
      - type: file
        url: https://raw.githubusercontent.com/hepfnepf/BlutfestBuilding/7819d6911e9b4a6e220158e5868f5ec6fba4071b/flatpak/io.github.hepfnepf.blutfest.desktop
        sha256: 7e9a87e747ceb39137fe2de56e0a218ef0c543d3569c473df11247764b2dc9df
      - type: file
        url: https://raw.githubusercontent.com/hepfnepf/BlutfestBuilding/0c33bd78148dce6a4581e780abd7b5fcb7b7bc20/flatpak/io.github.hepfnepf.blutfest.metainfo.xml
        sha256: 6403fb246ea501bfc6accb2a2563739a048d5b96ea6d3776a789a2d92a309b94
      - type: file
        url: https://raw.githubusercontent.com/hepfnepf/BlutfestBuilding/7819d6911e9b4a6e220158e5868f5ec6fba4071b/flatpak/icon.png
        sha256: 3d7bed6f37b1efe94b664ea623853a18702455dccb4716ce54e362b723e933cf
